---
- name: Automatisches System-Update für Ubuntu/Debian
  hosts: all
  become: true
  tasks:

    - name: Paket-Cache aktualisieren (apt update)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Alle Pakete aktualisieren (apt upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Prüfen, ob ein Neustart erforderlich ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Server neu starten (falls erforderlich)
      ansible.builtin.reboot:
        msg: "Neustart nach System-Updates von Ansible/Semaphore veranlasst"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists
