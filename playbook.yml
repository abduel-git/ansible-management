---
# --- PLAY 1: System Setup and User Creation ---

- name: System-Einrichtung und Benutzererstellung
  hosts: all
  become: yes
  vars:
    # Generierte SHA-512 Hashes für die Benutzer
    user_passwords:
      miki: "$6$gjiKVaZbvRyba2wl$jENpLDrqfqVIpy0jZoQmkqNq/W.Quz7yTQlaCIYOHj/KRRBwvBWHjjN7hwMn0CSVfykMUBxaNmIvEoRfslI59."
      abdu: "$6$2QCL.Edq9Ap4DGWY$lWcFqbyhvQXgm5FWbFVoT5ObUVg3RWKV8OifELNLv2zNIStABCybvsBrvlvEzn9GAlszpzu20i.uGBGSTScK90"
      ousama: "$6$gjiKVaZbvRyba2wl$jENpLDrqfqVIpy0jZoQmkqNq/W.Quz7yTQlaCIYOHj/KRRBwvBWHjjN7hwMn0CSVfykMUBxaNmIvEoRfslI59."

  tasks:
    - name: Erforderliche Pakete installieren (nano, wireguard, tcpdump, git)
      apt:
        name:
          - nano
          - wireguard
          - tcpdump
          - git
        state: present
        update_cache: yes

    - name: Benutzerkonto fuer Miki erstellen
      user:
        name: miki
        password: "ituma123456789"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

    - name: Benutzerkonto fuer Ousama erstellen
      user:
        name: ousama
        password: "ituma123456789"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

    - name: Eigenes Benutzerkonto erstellen (Abdu)
      user:
        name: abdu
        password: "ituma123456789"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

# --- PLAY 2: System Update and Upgrade ---

- name: Update und Upgrade auf Ubuntu Target-Servern
  hosts: all
  become: yes
  tasks:
    - name: Paketlisten aktualisieren (apt update)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Alle installierten Pakete aktualisieren (apt upgrade)
      apt:
        upgrade: dist
